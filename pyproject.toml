[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videoredact"
version = "0.1.3"
description = "Offline video/audio redaction tool for law enforcement: transcript-driven audio redaction, automatic and tracked video redaction."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Wyatt Rossell" }]
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "onnxruntime>=1.18",
    "onnx>=1.16",
    "faster-whisper>=1.0",
    "imageio-ffmpeg>=0.5",
    "soundfile>=0.12",
    "scipy>=1.11",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
videoredact = "videoredact.app:main"

[tool.setuptools.packages.find]
include = ["videoredact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
